<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphagen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<meta name="theme-color" content="#5a67d8">
<style>
  :root { --accent: #5a67d8; --border: #e5e7eb; --muted: #6b7280; }
  html { background: linear-gradient(135deg, #eef2ff, #faf5ff) fixed; }
  /* Fixed viewport layout: each card gets a third of the screen, so filling or filtering a history never resizes anything */
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 0 1rem; color: #1f2937;
         height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; }
  h1 { margin: .6rem 0 .5rem; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; color: var(--accent); }
  h1 svg { height: .62em; vertical-align: -.02em; margin-right: .03em; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: .7rem .9rem; margin-bottom: .6rem;
          box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 6px 20px rgb(79 70 229 / .07);
          flex: 1 1 0; min-height: 12rem; display: flex; flex-direction: column; gap: .45rem; }
  .card h2 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .hist { flex: 1; min-height: 0; overflow-y: scroll; border: 1px solid var(--border); border-radius: 4px;
          scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
  .hist table { table-layout: fixed; }
  .hist th { position: sticky; top: 0; background: #f5f3ff; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
  .hist td, .hist th { padding: .2rem .5rem; }
  .hist tbody tr:hover { background: #fafaff; }
  .hist button { padding: .1rem .5rem; font-size: .8rem; }
  .filter { flex: 1; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .out { flex: 1; min-width: 220px; font-family: ui-monospace, monospace; }
  input { font: inherit; font-size: .95rem; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 4px; background: #f9fafb; }
  input:focus { outline: 2px solid #c7d2fe; border-color: var(--accent); background: #fff; }
  .out:focus { outline: none; }
  button { font: inherit; font-size: .9rem; padding: .4rem .8rem; cursor: pointer; color: inherit; background: #fff;
           border: 1px solid var(--border); border-radius: 4px; }
  button:hover { background: #eef2ff; border-color: #c7d2fe; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .primary:hover { background: #4c51bf; border-color: #4c51bf; }
  [aria-pressed="true"], [aria-pressed="true"]:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  dialog { max-width: 700px; border: none; border-radius: 6px; padding: 1.2rem; box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
  dialog::backdrop { background: rgb(17 24 39 / .4); backdrop-filter: blur(2px); }
  dialog h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .toggles { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: 1rem; }
  .toggles button { min-width: 3.2rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .3rem; border-bottom: 1px solid #f1f1f4; }
  td.v { font-family: ui-monospace, monospace; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: .1rem 0 .5rem; }
</style>
</head>

<section class="card">
  <h2>IMEI</h2>
  <div class="row">
    <div class="toggles" role="group" aria-label="IMEI type" id="imeiType" style="margin:0">
      <button type="button" aria-pressed="true" data-v="generic">Generic</button>
      <button type="button" aria-pressed="false" data-v="iphone">iPhone</button>
    </div>
    <input class="out" id="imeiOut" readonly aria-label="IMEI">
    <button class="primary" id="imeiGen">Generate &amp; Copy</button>
  </div>
  <div class="row">
    <input class="filter" id="imeiFilter" placeholder="Filter: dd/mm/yyyy hh:mm:ss" aria-label="Filter IMEI history by date">
    <button id="imeiClear" aria-label="Clear IMEI filter">✕</button>
  </div>
  <div class="hist"><table>
    <thead><tr><th style="width:11rem">Date</th><th style="width:5rem">Type</th><th>IMEI</th><th style="width:5rem"></th><th style="width:6rem"></th></tr></thead>
    <tbody id="imeiHist"></tbody>
  </table></div>
</section>

<section class="card">
  <h2>Name + Address (US / Canada)</h2>
  <div class="row">
    <button id="stateBtn">States: <span id="stateSummary">Any</span></button>
    <div class="toggles" role="group" aria-label="Address type" id="addrMode" style="margin:0">
      <button type="button" aria-pressed="false" data-v="real">Real</button>
      <button type="button" aria-pressed="true" data-v="random">Random</button>
    </div>
    <input class="out" id="addrOut" readonly aria-label="Address">
    <button class="primary" id="addrGen">Generate &amp; Copy</button>
  </div>
  <div class="row">
    <input class="filter" id="addrFilter" placeholder="Filter: dd/mm/yyyy hh:mm:ss" aria-label="Filter address history by date">
    <button id="addrClear" aria-label="Clear address filter">✕</button>
  </div>
  <div class="hist"><table>
    <thead><tr><th style="width:11rem">Date</th><th>Name + Address</th><th style="width:5rem"></th><th style="width:6rem"></th></tr></thead>
    <tbody id="addrHist"></tbody>
  </table></div>
</section>

<section class="card">
  <h2>Phone (US / Canada)</h2>
  <div class="row">
    <input class="out" id="phoneOut" readonly aria-label="Phone">
    <button class="primary" id="phoneGen">Generate &amp; Copy</button>
  </div>
  <div class="row">
    <input class="filter" id="phoneFilter" placeholder="Filter: dd/mm/yyyy hh:mm:ss" aria-label="Filter phone history by date">
    <button id="phoneClear" aria-label="Clear phone filter">✕</button>
  </div>
  <div class="hist"><table>
    <thead><tr><th style="width:11rem">Date</th><th>Phone</th><th style="width:5rem"></th><th style="width:6rem"></th></tr></thead>
    <tbody id="phoneHist"></tbody>
  </table></div>
</section>

<dialog id="stateDialog">
  <form method="dialog">
    <p>Select states / provinces (none selected = any).</p>
    <h3>United States</h3>
    <div class="toggles" role="group" aria-label="US states" id="usToggles"></div>
    <h3>Canada</h3>
    <div class="toggles" role="group" aria-label="Canadian provinces" id="caToggles"></div>
    <div class="row">
      <button type="button" id="stateNone">Clear selection</button>
      <button class="primary">Done</button>
    </div>
  </form>
</dialog>

<footer>© <span id="year"></span> Alphagen</footer>

// Luhn check digit for the 14-digit IMEI body
function luhn(s) {
  let sum = 0;
  for (let i = 0; i < s.length; i++) {
    let d = +s[s.length - 1 - i];
    if (i % 2 === 0) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
  }
  return (10 - sum % 10) % 10;
}

function imei(type) {

  return body + luhn(body);

};

console.assert([...Object.keys(US), ...Object.keys(CA)].every(k => REAL[k]?.length === 5), 'REAL needs 5 addresses per state');

function address(selected, real) {
  const code = selected.length ? pick(selected) : pick([...Object.keys(US), ...Object.keys(CA)]);
  if (real) return pick(REAL[code]);
  const isCA = code in CA;
  const entry = pick((isCA ? CA : US)[code].split('|'));
  const cut = entry.lastIndexOf(' ');
  const city = entry.slice(0, cut), post = entry.slice(cut + 1);
  const postal = isCA ? `${post} ${rnd(10)}${pick(POSTAL_LETTERS)}${rnd(10)}` : post;
  return `${1 + rnd(9999)} ${pick(STREETS)}, ${city}, ${code} ${postal}`;
}

// Ubuntu release codenames; names mix an adjective and animal sharing a first letter, Ubuntu style
const UBUNTU = ('Warty Warthog|Hoary Hedgehog|Breezy Badger|Dapper Drake|Edgy Eft|Feisty Fawn|Gutsy Gibbon|Hardy Heron|Intrepid Ibex|'
  + 'Jaunty Jackalope|Karmic Koala|Lucid Lynx|Maverick Meerkat|Natty Narwhal|Oneiric Ocelot|Precise Pangolin|Quantal Quetzal|'
  + 'Raring Ringtail|Saucy Salamander|Trusty Tahr|Utopic Unicorn|Vivid Vervet|Wily Werewolf|Xenial Xerus|Yakkety Yak|Zesty Zapus|'
  + 'Artful Aardvark|Bionic Beaver|Cosmic Cuttlefish|Disco Dingo|Eoan Ermine|Focal Fossa|Groovy Gorilla|Hirsute Hippo|Impish Indri|'
  + 'Jammy Jellyfish|Kinetic Kudu|Lunar Lobster|Mantic Minotaur|Noble Numbat|Oracular Oriole|Plucky Puffin|Questing Quokka')
  .split('|').map(s => s.split(' '));
function fullName() {
  const [first] = pick(UBUNTU);
  return `${first} ${pick(UBUNTU.filter(([a]) => a[0] === first[0]))[1]}`;
}

// Real, assigned area codes (US + Canada)
const AREA = ('205 907 602 501 213 415 619 303 203 302 202 305 407 404 808 208 312 317 515 316 502 504 207 410 617 313 612 601 816 406 402 702 603 201 505 212 704 701 614 405 503 215 401 803 605 615 713 214 512 469 801 802 804 206 304 414 307 '
  + '403 780 604 250 204 506 709 902 867 416 647 613 514 418 306 905').split(' ');
function phone() {
  let ex;
  do ex = String(2 + rnd(8)) + digits(2); while (ex.endsWith('11') || ex === '555'); // N11 and 555 are not real exchanges
  return pick(AREA) + ex + digits(4);
}
console.assert(/^[2-9]\d{2}[2-9]\d{6}$/.test(phone()), 'phone self-check failed');

// History
const KEY = 'alphagen-history';
// shortcut: history grows unbounded in localStorage (~5MB), add a cap or a clear button if it ever fills up
let history = JSON.parse(localStorage.getItem(KEY) || '[]');
const pad = n => String(n).padStart(2, '0');
const fmt = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.dataset.label ??= btn.textContent; // keep the real label across rapid clicks
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = old, 1000);
  });
}

// One stored list; each record's type decides which group's history shows it
const groupOf = h => h.type.startsWith('IMEI') ? 'imei' : h.type === 'Address' ? 'addr' : 'phone';
const GROUPS = ['imei', 'addr', 'phone'];
const save = () => localStorage.setItem(KEY, JSON.stringify(history));
const button = (textContent, title, onclick) => Object.assign(document.createElement('button'), { textContent, title, onclick });

function render(g) {
  const f = $(g + 'Filter').value.trim();
  $(g + 'Hist').replaceChildren(...history.filter(h => groupOf(h) === g && fmt(h.ts).startsWith(f)).map(h => {
    const tr = document.createElement('tr');
    const cells = g === 'imei' ? [[fmt(h.ts)], [h.type === 'IMEI (iPhone)' ? 'iPhone' : 'Generic'], [h.value, 'v']] : [[fmt(h.ts)], [h.value, 'v']];
    for (const [t, cls] of cells) {
      const td = tr.insertCell();
      td.textContent = t;
      if (cls) td.className = cls;
    }
    const b = button('Copy', 'Copy', () => copy(h.value, b));
    tr.insertCell().append(b);
    const del = tr.insertCell();
    // Cancel sits where 🗑️ was, so a double click can't delete; confirming needs a deliberate mouse move
    const trash = button('🗑️', 'Delete', () => del.replaceChildren(
      button('❌', 'Cancel delete', () => del.replaceChildren(trash)),
      button('✅', 'Confirm delete', () => { history.splice(history.indexOf(h), 1); save(); render(g); })));
    del.append(trash);
    return tr;
  }));
}

function generate(type, outId, value, btn) {
  $(outId).value = value;
  copy(value, btn);
  history.unshift({ type, value, ts: Date.now() });
  save();
  render(outId.replace('Out', ''));
}

// Toggle groups
const pressed = el => el.getAttribute('aria-pressed') === 'true';
for (const id of ['imeiType', 'addrMode']) $(id).onclick = e => {
  if (!e.target.dataset.v) return;
  for (const b of $(id).children) b.setAttribute('aria-pressed', b === e.target);
};
for (const [id, data] of [['usToggles', US], ['caToggles', CA]]) {
  for (const code of Object.keys(data)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = code;
    b.title = data[code].split('|').map(c => c.slice(0, c.lastIndexOf(' '))).join(', ');
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => b.setAttribute('aria-pressed', !pressed(b));
    $(id).append(b);
  }
}
const stateButtons = () => [...document.querySelectorAll('#usToggles button, #caToggles button')];
const selectedStates = () => stateButtons().filter(pressed).map(b => b.textContent);
$('stateBtn').onclick = () => $('stateDialog').showModal();
$('stateNone').onclick = () => stateButtons().forEach(b => b.setAttribute('aria-pressed', 'false'));
$('stateDialog').onclose = () => $('stateSummary').textContent = selectedStates().join(', ') || 'Any';

// Buttons
$('imeiGen').onclick = () => {
  const type = document.querySelector('#imeiType [aria-pressed="true"]').dataset.v;
  generate(type === 'iphone' ? 'IMEI (iPhone)' : 'IMEI', 'imeiOut', imei(type), $('imeiGen'));
};
$('addrGen').onclick = () => {
  const real = document.querySelector('#addrMode [aria-pressed="true"]').dataset.v === 'real';
  generate('Address', 'addrOut', `${fullName()}, ${address(selectedStates(), real)}`, $('addrGen'));
};
$('phoneGen').onclick = () => generate('Phone', 'phoneOut', phone(), $('phoneGen'));
for (const g of GROUPS) {
  $(g + 'Filter').oninput = () => render(g);
  $(g + 'Clear').onclick = () => { $(g + 'Filter').value = ''; render(g); $(g + 'Filter').focus(); };
  render(g);
}
</script>
